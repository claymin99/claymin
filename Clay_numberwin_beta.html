<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8" />
  <title>Clay Numberwin Beta</title>

  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="style.css">

  <!-- Google Font -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Kanit&display=swap" rel="stylesheet">
</head>

<body>
<div class="container">

  <div class="top-bar">
    <h2 class="title">ช่องใส่เลข</h2>
    <button class="dark-btn" onclick="toggleDark()">🌙</button>
  </div>

  <div class="input-row">
    <input id="numberInput" placeholder="" />
    <button class="reset-btn" onclick="resetInput()">Reset</button>
    <span id="countText" class="count-text">จำนวนเลขวิน 0 เลข</span>
  </div>

  <div class="box">
    <div class="header">
      <b>วินสองตัว ไม่กลับ</b>
      <button onclick="copy('out1')">Copy</button>
    </div>
    <textarea id="out1" readonly></textarea>
  </div>

  <div class="box">
    <div class="header">
      <b>วินสองตัว (รวมเบิ้ล) ไม่กลับ</b>
      <button onclick="copy('out2')">Copy</button>
    </div>
    <textarea id="out2" readonly></textarea>
  </div>

  <div class="box">
    <div class="header">
      <b>วินสามตัว ไม่กลับ</b>
      <button onclick="copy('out3')">Copy</button>
    </div>
    <textarea id="out3" readonly></textarea>
  </div>

  <div class="box">
    <div class="header">
      <b>วินสามตัว (รวมเบิ้ล) ไม่กลับ</b>
      <button onclick="copy('out4')">Copy</button>
    </div>
    <textarea id="out4" readonly></textarea>
  </div>

</div>

<script>
const input = document.getElementById('numberInput');
const countText = document.getElementById('countText');

input.addEventListener('input', () => {
  let val = input.value;

  val = val.replace(/[^0-9]/g, '');

  if (val.length > 7) val = '';

  input.value = val;
  countText.textContent = `จำนวนเลขวิน ${val.length} เลข`;

  generate(val.split(''));
});


function generate(arr) {
  out1.value = win2(arr).join(' ');
  out2.value = win2Double(arr).join(' ');
  out3.value = win3(arr).join(' ');
  out4.value = win3Double(arr).join(' ');
}

function win2(a){
  const r=[];
  for(let i=0;i<a.length;i++)
    for(let j=i+1;j<a.length;j++)
      r.push(a[i]+a[j]);
  return r;
}

function win2Double(a){
  const r=[];
  for(let i=0;i<a.length;i++)
    for(let j=i;j<a.length;j++)
      r.push(a[i]+a[j]);
  return r;
}

function win3(a){
  const r=[];
  for(let i=0;i<a.length;i++)
    for(let j=i+1;j<a.length;j++)
      for(let k=j+1;k<a.length;k++)
        r.push(a[i]+a[j]+a[k]);
  return r;
}

function win3Double(a){
  const r=[];
  for(let i=0;i<a.length;i++)
    for(let j=i;j<a.length;j++)
      for(let k=j;k<a.length;k++)
        r.push(a[i]+a[j]+a[k]);
  return r;
}

function copy(id){
  const el = document.getElementById(id);
  el.select();
  document.execCommand('copy');
}

function resetInput(){
  input.value='';
  countText.textContent='จำนวนเลขวิน 0 เลข';
  out1.value=out2.value=out3.value=out4.value='';
  input.focus();
}

function toggleDark(){
  document.body.classList.toggle('dark');
}
</script>

</body>
</html>
